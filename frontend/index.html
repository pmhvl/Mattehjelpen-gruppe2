<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <title>MatteHjelpen</title>
  <!-- MathJax for LaTeX-rendering -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 5rem; font-size: 1rem; }
    button { font-size: 1rem; padding: 0.5rem 1.5rem; margin-top: 0.5rem; cursor: pointer; }
    .validert-ok { color: green; font-weight: bold; }
    .validert-feil { color: red; font-weight: bold; }
    .kostnad { color: #666; font-size: 0.9rem; margin-top: 1rem; }
    li { margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <h1>MatteHjelpen 🧮</h1>
  <p>Skriv inn en matteoppgave (f.eks. «Løs y'' + 4y = 0» eller «Deriver x²·sin(x)»):</p>
  <textarea id="oppgave" placeholder="Skriv oppgaven her..."></textarea>
  <br>
  <button onclick="los()">Løs</button>

  <div id="resultat" style="display:none">
    <h2>Svar</h2>
    <div id="svar"></div>
    <h3>Stegvis løsning</h3>
    <ol id="steg"></ol>
    <h3>Formler brukt</h3>
    <ul id="formler"></ul>
    <p id="validering"></p>
    <p class="kostnad" id="kostnad"></p>
  </div>

  <script>
    async function los() {
      const oppgave = document.getElementById('oppgave').value;
      const res = await fetch('/solve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ oppgave })
      });
      const data = await res.json();

      document.getElementById('resultat').style.display = 'block';
      document.getElementById('svar').innerHTML = data.svar;
      document.getElementById('steg').innerHTML =
        data.steg.map(s => `<li>${s}</li>`).join('');
      document.getElementById('formler').innerHTML =
        data.formler_brukt.map(f => `<li>${f}</li>`).join('');
      const v = document.getElementById('validering');
      v.textContent = data.validert ? '✅ Svaret er numerisk validert' : '❌ Svaret kunne IKKE valideres – stol ikke blindt på det!';
      v.className = data.validert ? 'validert-ok' : 'validert-feil';
      document.getElementById('kostnad').textContent =
        `Tokens brukt: ${data.tokens_brukt} · Estimert kostnad: $${data.estimert_kostnad}`;
      MathJax.typeset();
    }
  </script>
</body>
</html>
